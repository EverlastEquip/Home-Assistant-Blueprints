blueprint:
  name: IKEA BILRESA dual button - Device via Matter
  description: >
    Simpel blueprint til IKEA BILRESA dual button via Matter, hvor du vælger
    selve enheden (ikke de enkelte event-entiteter).
    Understøtter klik, dobbeltklik, hold og slip for knap 1 og knap 2.
    OBS: Knap 1/2 bestemmes ud fra rækkefølgen af enhedens event-entiteter
    (sorteret efter entity_id). Tjek at det passer med dine knapper.
    OBS: Lytter på alle state_changed-events og filtrerer i en condition.
  domain: automation
  source_url: https://github.com/math7935/Home-Assistant-Blueprints/blueprints/automation/ikea_bilresa_dual_button_matter_device.yaml

  input:
    remote:
      name: IKEA BILRESA dual button (Matter device)
      selector:
        device:
          integration: matter
          manufacturer: IKEA of Sweden

    # ---------------------------------------------------------------
    # KNAP 1
    # ---------------------------------------------------------------
    b1_click:
      name: "Knap 1 – Klik"
      default: []
      selector: { action: {} }

    b1_double:
      name: "Knap 1 – Dobbeltklik"
      default: []
      selector: { action: {} }

    b1_hold:
      name: "Knap 1 – Hold (long_press)"
      default: []
      selector: { action: {} }

    b1_release:
      name: "Knap 1 – Slip efter hold (long_release)"
      default: []
      selector: { action: {} }

    # ---------------------------------------------------------------
    # KNAP 2
    # ---------------------------------------------------------------
    b2_click:
      name: "Knap 2 – Klik"
      default: []
      selector: { action: {} }

    b2_double:
      name: "Knap 2 – Dobbeltklik"
      default: []
      selector: { action: {} }

    b2_hold:
      name: "Knap 2 – Hold (long_press)"
      default: []
      selector: { action: {} }

    b2_release:
      name: "Knap 2 – Slip efter hold (long_release)"
      default: []
      selector: { action: {} }

mode: single
max_exceeded: silent

variables:
  remote_id: !input remote

trigger:
  - platform: event
    event_type: state_changed

condition:
  - condition: template
    value_template: >
      {% set eid = trigger.event.data.entity_id %}
      {% set new = trigger.event.data.new_state %}
      {% set old = trigger.event.data.old_state %}
      {{ eid.startswith('event.')
         and eid in device_entities(remote_id)
         and new is not none
         and old is not none
         and old.state not in ['unavailable', 'unknown']
         and new.state not in ['unavailable', 'unknown'] }}

action:
  - variables:
      eid: "{{ trigger.event.data.entity_id }}"
      event_entities: >
        {{ device_entities(remote_id) | select('match', '^event\.') | list | sort }}
      button: "{{ event_entities.index(eid) + 1 }}"
      event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
      press_count: "{{ trigger.event.data.new_state.attributes.total_number_of_presses_counted | default(0) | int(0) }}"
  - choose:
      # ---------------- KNAP 1 ----------------
      - conditions: "{{ button == 1 and event_type == 'short_release' }}"
        sequence: !input b1_click

      - conditions: "{{ button == 1 and event_type == 'multi_press_complete' and press_count == 2 }}"
        sequence: !input b1_double

      - conditions: "{{ button == 1 and event_type == 'long_press' }}"
        sequence: !input b1_hold

      - conditions: "{{ button == 1 and event_type == 'long_release' }}"
        sequence: !input b1_release

      # ---------------- KNAP 2 ----------------
      - conditions: "{{ button == 2 and event_type == 'short_release' }}"
        sequence: !input b2_click

      - conditions: "{{ button == 2 and event_type == 'multi_press_complete' and press_count == 2 }}"
        sequence: !input b2_double

      - conditions: "{{ button == 2 and event_type == 'long_press' }}"
        sequence: !input b2_hold

      - conditions: "{{ button == 2 and event_type == 'long_release' }}"
        sequence: !input b2_release