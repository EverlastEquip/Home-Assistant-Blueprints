blueprint:
  name: IKEA BILRESA dual button - Simple via Matter
  description: >
    Simpel blueprint til IKEA BILRESA dual button (E2489) via Matter.
    Understøtter klik, dobbeltklik, hold (ved tryk) og slip efter hold
    for knap 1 og knap 2. Bruger de to event-entiteter, som HA opretter
    for hver knap, så der kun trigges ved rigtige knaphandlinger.
    Event-typer: multi_press_1, multi_press_2, long_press, long_release.
  domain: automation
  source_url: https://github.com/math7935/Home-Assistant-Blueprints/blueprints/automation/ikea_bilresa_dual_button_matter.yaml

  input:
    button_1:
      name: Knap 1 (event-entitet)
      description: Matter event-entiteten for den første knap.
      selector:
        entity:
          filter:
            - domain: event
              integration: matter

    button_2:
      name: Knap 2 (event-entitet)
      description: Matter event-entiteten for den anden knap.
      selector:
        entity:
          filter:
            - domain: event
              integration: matter

    # ---------------------------------------------------------------
    # KNAP 1
    # ---------------------------------------------------------------
    b1_click:
      name: "Knap 1 – Klik (multi_press_1)"
      default: []
      selector: { action: {} }

    b1_double:
      name: "Knap 1 – Dobbeltklik (multi_press_2)"
      default: []
      selector: { action: {} }

    b1_hold:
      name: "Knap 1 – Hold (long_press)"
      default: []
      selector: { action: {} }

    b1_release:
      name: "Knap 1 – Slip efter hold (long_release)"
      default: []
      selector: { action: {} }

    # ---------------------------------------------------------------
    # KNAP 2
    # ---------------------------------------------------------------
    b2_click:
      name: "Knap 2 – Klik (multi_press_1)"
      default: []
      selector: { action: {} }

    b2_double:
      name: "Knap 2 – Dobbeltklik (multi_press_2)"
      default: []
      selector: { action: {} }

    b2_hold:
      name: "Knap 2 – Hold (long_press)"
      default: []
      selector: { action: {} }

    b2_release:
      name: "Knap 2 – Slip efter hold (long_release)"
      default: []
      selector: { action: {} }

mode: restart
max_exceeded: silent

trigger:
  # not_from/not_to forhindrer udløsning ved genstart af HA/Matter
  # (event-entiteter bruger timestamp som state).
  - platform: state
    entity_id: !input button_1
    id: b1
    not_from: 'unavailable'
    not_to: 'unavailable'

  - platform: state
    entity_id: !input button_2
    id: b2
    not_from: 'unavailable'
    not_to: 'unavailable'

variables:
  event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"

action:
  - choose:
      # ---------------- KNAP 1 ----------------
      - conditions: "{{ trigger.id == 'b1' and event_type == 'multi_press_1' }}"
        sequence: !input b1_click

      - conditions: "{{ trigger.id == 'b1' and event_type == 'multi_press_2' }}"
        sequence: !input b1_double

      - conditions: "{{ trigger.id == 'b1' and event_type == 'long_press' }}"
        sequence: !input b1_hold

      - conditions: "{{ trigger.id == 'b1' and event_type == 'long_release' }}"
        sequence: !input b1_release

      # ---------------- KNAP 2 ----------------
      - conditions: "{{ trigger.id == 'b2' and event_type == 'multi_press_1' }}"
        sequence: !input b2_click

      - conditions: "{{ trigger.id == 'b2' and event_type == 'multi_press_2' }}"
        sequence: !input b2_double

      - conditions: "{{ trigger.id == 'b2' and event_type == 'long_press' }}"
        sequence: !input b2_hold

      - conditions: "{{ trigger.id == 'b2' and event_type == 'long_release' }}"
        sequence: !input b2_release